# Render Blueprint. main 브랜치에 push하면 자동 배포된다.
services:
  - type: web
    name: interior-ai-studio
    runtime: python
    region: singapore
    plan: starter
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: python app/server.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: BIND
        value: 0.0.0.0
      - key: SECURE_COOKIE
        value: "1"
      - key: DAILY_RENDER_LIMIT
        value: "60"
      - key: GEMINI_TEXT_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_IMAGE_MODEL
        value: gemini-2.5-flash-image
      - key: SESSION_SECRET
        generateValue: true
      # 아래 두 값은 저장소에 넣지 않는다. Render 대시보드에서 입력한다.
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
